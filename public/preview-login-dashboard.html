<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 → 监管大屏 动效预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #02040a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

    .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

    /* ========== 登录页（保留） ========== */
    .login-screen {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 12vw;
      background: #02040a;
      z-index: 20;
      transition: opacity 0.8s ease, transform 1s cubic-bezier(0.65, 0, 0.35, 1), filter 0.8s ease;
    }
    .login-screen.exiting { opacity: 0; transform: scale(1.1); filter: brightness(2.4) blur(6px); pointer-events: none; }
    .login-screen.gone { display: none; }

    .login-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.95; }

    .login-form {
      position: relative;
      width: min(380px, 30vw); min-width: 300px;
      padding: 36px 32px; border-radius: 16px;
      background: rgba(6, 18, 36, 0.72);
      border: 1px solid rgba(100, 200, 255, 0.18);
      box-shadow: 0 24px 70px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
      opacity: 0; transform: translateY(40px);
      animation: formIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }
    .login-title { font-size: 20px; color: #fff; text-align: center; margin-bottom: 28px; letter-spacing: 2px; font-weight: 500; }
    .input-group { position: relative; margin-bottom: 18px; }
    .input-group input {
      width: 100%; padding: 13px 14px 13px 38px; border-radius: 8px;
      border: 1px solid rgba(100, 200, 255, 0.18); background: rgba(0, 20, 45, 0.55);
      color: #caf0ff; font-size: 14px; outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .input-group input:focus, .input-group input.filled { border-color: rgba(0, 212, 255, 0.6); box-shadow: 0 0 18px rgba(0, 212, 255, 0.18); }
    .input-group .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; opacity: 0.55; }
    .input-group .icon svg { width: 100%; height: 100%; fill: none; stroke: #7dd3fc; stroke-width: 1.6; }
    .remember { display: flex; align-items: center; gap: 8px; margin: 14px 0 24px; color: rgba(200, 230, 255, 0.65); font-size: 12px; }
    .remember span { width: 13px; height: 13px; border: 1px solid rgba(100, 200, 255, 0.3); border-radius: 3px; display: inline-block; }
    .login-btn {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      background: linear-gradient(90deg, #00a8ff, #00d4ff); color: #00101a;
      font-size: 16px; font-weight: 600; letter-spacing: 4px; cursor: pointer;
      position: relative; overflow: hidden; transition: transform 0.2s, box-shadow 0.3s;
    }
    .login-btn::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.55), transparent 60%);
      opacity: 0; transition: opacity 0.4s;
    }
    .login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(0, 212, 255, 0.35); }
    .login-btn:hover::after { opacity: 1; }
    .login-btn.active { box-shadow: 0 0 40px rgba(0, 212, 255, 0.65); }
    .login-btn.loading { pointer-events: none; }
    .login-btn.loading::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      transform: translateX(-100%); animation: shimmer 1s infinite;
    }
    @keyframes shimmer { to { transform: translateX(100%); } }
    @keyframes formIn { to { opacity: 1; transform: translateY(0); } }
    .typing-cursor::after { content: '|'; animation: blink 0.85s infinite; color: #00d4ff; margin-left: 2px; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .login-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 25; }
    .login-flash.flash { animation: flash 0.6s ease-out; }
    @keyframes flash { 0% { opacity: 0; } 25% { opacity: 0.4; } 100% { opacity: 0; } }

    .enter-hint {
      position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%);
      color: rgba(255,255,255,0.6); font-size: 12px; letter-spacing: 2px;
      z-index: 21; opacity: 0; animation: fadeIn 1s ease 1.6s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    /* ========== 大屏：三层叠加 ========== */
    .dashboard-screen {
      position: absolute; inset: 0; overflow: hidden;
      opacity: 0; transform: scale(1.02);
      transition: opacity 0.6s ease;
      z-index: 10;
      background: #02040a;
    }
    .dashboard-screen.active { opacity: 1; }

    .dashboard-layers { position: absolute; inset: 0; perspective: 1200px; }

    .layer {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: all 1.1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 层级1：地图底图 - 从模糊放大到清晰 */
    .layer-1 {
      transform: scale(1.18);
      filter: blur(10px) brightness(0.6);
    }
    .dashboard-screen.active .layer-1 {
      opacity: 1;
      transform: scale(1);
      filter: blur(0) brightness(1);
      transition-delay: 0.15s;
    }

    /* 层级2：探测圈/目标点 - 从中心扩散 */
    .layer-2 {
      transform: scale(0.88);
      filter: brightness(1.3) drop-shadow(0 0 30px rgba(0, 212, 255, 0));
    }
    .dashboard-screen.active .layer-2 {
      opacity: 1;
      transform: scale(1);
      filter: brightness(1) drop-shadow(0 0 30px rgba(0, 212, 255, 0.25));
      transition-delay: 0.75s;
    }

    /* 层级3：面板/Header - 从上方扫描揭示 */
    .layer-3 {
      transform: translateY(-18px);
      clip-path: inset(0 0 100% 0);
    }
    .dashboard-screen.active .layer-3 {
      opacity: 1;
      transform: translateY(0);
      clip-path: inset(0 0 0 0);
      transition-delay: 1.35s;
    }

    /* 探测圈呼吸脉冲 */
    .layer-breathe {
      position: absolute; inset: 0; pointer-events: none; z-index: 11;
      background: radial-gradient(circle at 50% 55%, rgba(0, 212, 255, 0.12), transparent 45%);
      opacity: 0; mix-blend-mode: screen;
      transition: opacity 0.8s ease;
    }
    .dashboard-screen.active .layer-breathe { opacity: 1; transition-delay: 1.1s; }
    .dashboard-screen.active .layer-breathe::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 55%, rgba(0, 212, 255, 0.18), transparent 40%);
      animation: breathe 3.5s ease-in-out infinite;
    }
    @keyframes breathe { 0%, 100% { transform: scale(0.95); opacity: 0.4; } 50% { transform: scale(1.08); opacity: 0.9; } }

    /* 扫描线 - 贯穿 reveal */
    .scan-line {
      position: absolute; left: 0; right: 0; top: -4px; height: 3px;
      background: linear-gradient(90deg, transparent, #00d4ff, #7dd3fc, transparent);
      box-shadow: 0 0 32px #00d4ff, 0 0 60px rgba(0, 212, 255, 0.4);
      opacity: 0; z-index: 15; pointer-events: none;
      transform: translateY(-20px);
    }
    .scan-line.run { animation: scanReveal 1.6s ease-in-out 1.35s forwards; }
    @keyframes scanReveal {
      0% { top: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* 地图上的定位脉冲 */
    .pulse-ring {
      position: absolute; left: 50%; top: 54%; width: 120px; height: 120px;
      transform: translate(-50%, -50%); border: 2px solid rgba(0, 212, 255, 0.7); border-radius: 50%;
      opacity: 0; pointer-events: none; z-index: 14;
    }
    .pulse-ring.run { animation: pulseOut 2.2s ease-out 1.9s infinite; }
    @keyframes pulseOut { 0% { transform: translate(-50%,-50%) scale(0.3); opacity: 0.8; } 100% { transform: translate(-50%,-50%) scale(2.6); opacity: 0; } }
    .pulse-ring:nth-child(2) { left: 42%; top: 46%; }
    .pulse-ring:nth-child(3) { left: 58%; top: 62%; }

    /* 数据高光 */
    .data-glow {
      position: absolute; background: radial-gradient(circle, rgba(0,212,255,0.28), transparent 70%);
      border-radius: 50%; opacity: 0; pointer-events: none; z-index: 14;
    }
    .data-glow.run { animation: dataPop 1.2s ease-out 2.1s forwards; }
    @keyframes dataPop { 0% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1.15); } 100% { opacity: 0.45; transform: scale(1); } }

    /* 模块标签（装饰） */
    .layer-labels { position: absolute; inset: 0; z-index: 16; pointer-events: none; opacity: 0; transition: opacity 0.8s ease 2s; }
    .dashboard-screen.active .layer-labels { opacity: 1; }
    .layer-label {
      position: absolute; padding: 5px 10px; border-radius: 4px;
      background: rgba(0, 212, 255, 0.1); border: 1px solid rgba(0, 212, 255, 0.25);
      color: #00d4ff; font-size: 10px; letter-spacing: 1px; opacity: 0;
    }
    .dashboard-screen.active .layer-label { animation: labelIn 0.6s ease forwards; }
    .layer-label.l1 { left: 50%; bottom: 6%; transform: translateX(-50%); animation-delay: 2.2s; }
    .layer-label.l2 { left: 50%; top: 46%; transform: translateX(-50%); animation-delay: 2.45s; }
    .layer-label.l3 { right: 2%; top: 2%; animation-delay: 2.7s; }
    @keyframes labelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .dashboard-screen.active .layer-label.l1 { transform: translateX(-50%) translateY(0); }
    .dashboard-screen.active .layer-label.l2 { transform: translateX(-50%) translateY(0); }

    .replay-btn {
      position: fixed; right: 28px; bottom: 28px; z-index: 50;
      padding: 12px 22px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.85); font-size: 13px; cursor: pointer;
      opacity: 0; transform: translateY(20px); transition: all 0.4s; backdrop-filter: blur(10px);
    }
    .replay-btn.show { opacity: 1; transform: translateY(0); }
    .replay-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

    .status-tip {
      position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
      padding: 10px 22px; border-radius: 999px; background: rgba(0,0,0,0.45);
      color: rgba(255,255,255,0.7); font-size: 12px; letter-spacing: 1px;
      z-index: 50; opacity: 0; transition: opacity 0.5s; pointer-events: none; backdrop-filter: blur(8px);
    }
    .status-tip.show { opacity: 1; }

    @media (max-aspect-ratio: 16/10) {
      .login-form { padding-right: 8vw; width: min(360px, 38vw); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <!-- 登录页 -->
    <div class="login-screen" id="loginScreen">
      <img class="login-bg" src="media/preview/login.webp" alt="" />
      <div class="login-form" id="loginForm">
        <div class="login-title">账号密码登录</div>
        <div class="input-group">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <input type="text" id="userInput" placeholder="请输入账号" readonly />
        </div>
        <div class="input-group">
          <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" id="passInput" placeholder="请输入密码" readonly />
        </div>
        <div class="remember"><span></span> 自动登录</div>
        <button class="login-btn" id="loginBtn">登录</button>
      </div>
      <div class="enter-hint">自动演示中 · 模拟账号登录后进入系统</div>
    </div>

    <div class="login-flash" id="loginFlash"></div>

    <!-- 首页：三层叠加 -->
    <div class="dashboard-screen" id="dashboardScreen">
      <div class="dashboard-layers">
        <img class="layer layer-1" src="media/preview/layer1.webp" alt="" />
        <img class="layer layer-2" src="media/preview/layer2.webp" alt="" />
        <img class="layer layer-3" src="media/preview/layer3.webp" alt="" />
        <div class="layer-breathe" aria-hidden="true"></div>
      </div>

      <div class="scan-line" id="scanLine"></div>
      <div class="pulse-ring" id="pulse1"></div>
      <div class="pulse-ring" id="pulse2"></div>
      <div class="pulse-ring" id="pulse3"></div>
      <div class="data-glow" style="left: 4%; top: 14%; width: 140px; height: 140px;"></div>
      <div class="data-glow" style="right: 3%; top: 14%; width: 120px; height: 120px;"></div>
      <div class="data-glow" style="right: 3%; top: 42%; width: 110px; height: 110px;"></div>

      <div class="layer-labels">
        <span class="layer-label l1">LAYER 01 · 底图</span>
        <span class="layer-label l2">LAYER 02 · 探测数据</span>
        <span class="layer-label l3">LAYER 03 · 面板 / Header</span>
      </div>
    </div>

    <button class="replay-btn" id="replayBtn">↻ 重新播放</button>
    <div class="status-tip" id="statusTip">自动演示中，点击“重新播放”可再看一遍</div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const loginScreen = $('loginScreen');
    const loginBtn = $('loginBtn');
    const loginFlash = $('loginFlash');
    const dashboardScreen = $('dashboardScreen');
    const scanLine = $('scanLine');
    const replayBtn = $('replayBtn');
    const statusTip = $('statusTip');
    const userInput = $('userInput');
    const passInput = $('passInput');

    let running = false;
    const wait = ms => new Promise(r => setTimeout(r, ms));

    function typeText(input, text, duration = 600) {
      input.classList.add('typing-cursor');
      const step = duration / text.length;
      let i = 0;
      return new Promise(resolve => {
        const timer = setInterval(() => {
          input.value += text[i];
          i++;
          if (i >= text.length) {
            clearInterval(timer);
            input.classList.remove('typing-cursor');
            input.classList.add('filled');
            resolve();
          }
        }, step);
      });
    }

    async function play() {
      if (running) return;
      running = true;
      replayBtn.classList.remove('show');
      statusTip.classList.remove('show');

      // 重置
      loginScreen.classList.remove('exiting', 'gone');
      loginScreen.style.opacity = '1';
      loginScreen.style.transform = 'none';
      loginBtn.classList.remove('active', 'loading');
      loginBtn.textContent = '登录';
      userInput.value = '';
      passInput.value = '';
      userInput.classList.remove('filled');
      passInput.classList.remove('filled');
      dashboardScreen.classList.remove('active');
      document.querySelectorAll('.scan-line, .pulse-ring, .data-glow').forEach(el => el.classList.remove('run'));

      await wait(1100);
      await typeText(userInput, 'admin', 480);
      await wait(300);
      await typeText(passInput, '••••••••', 460);
      await wait(380);

      loginBtn.classList.add('active');
      await wait(450);
      loginBtn.classList.add('loading');
      loginBtn.textContent = '登录中...';
      await wait(850);

      loginFlash.classList.add('flash');
      await wait(260);
      loginScreen.classList.add('exiting');
      dashboardScreen.classList.add('active');
      await wait(820);
      loginScreen.classList.add('gone');
      loginFlash.classList.remove('flash');

      await wait(500);
      scanLine.classList.add('run');
      document.querySelectorAll('.pulse-ring').forEach(el => el.classList.add('run'));
      document.querySelectorAll('.data-glow').forEach(el => el.classList.add('run'));

      await wait(3200);
      statusTip.classList.add('show');
      await wait(1100);
      replayBtn.classList.add('show');
      running = false;
    }

    replayBtn.addEventListener('click', play);
    play();
  </script>
</body>
</html>
