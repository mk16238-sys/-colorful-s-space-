<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140c26"/>
      <stop offset="1" stop-color="#0a0616"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="84"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcf7f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f9b95c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c98a4a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <g>
    <circle cx="324" cy="480" r="360" fill="#ffcf7f" opacity="0.8" filter="url(#soft)"/>
    <circle cx="840" cy="384" r="264" fill="#f9b95c" opacity="0.6" filter="url(#soft)"/>
    <circle cx="672.0000000000001" cy="1408" r="408.00000000000006" fill="#c98a4a" opacity="0.55" filter="url(#soft)"/>
  </g>
  <rect width="1200" height="1600" fill="url(#grid)"/>
  <rect width="1200" height="1600" filter="url(#grain)" opacity="0.05"/>

  <!-- 装饰线 -->
  <rect x="96" y="832" width="1008" height="1.5" fill="url(#line)"/>
  <circle cx="96" cy="832.75" r="4" fill="#f9b95c"/>

  <!-- 文字 -->
  <text x="96" y="704" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="138" font-weight="700" fill="#ffffff" fill-opacity="0.9"
        letter-spacing="-7.2">02</text>

  <text x="96" y="992" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="600" fill="#ffffff" fill-opacity="0.86">Bloom Branding</text>

  <text x="96" y="1088" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="23" font-weight="400" fill="#ffffff" fill-opacity="0.42"
        letter-spacing="4.8">BRANDING / POSTER · 2025</text>

  <text x="1104" y="1488" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="17" fill="#ffffff" fill-opacity="0.3"
        letter-spacing="6">COLORFUL'S SPACE</text>
</svg>