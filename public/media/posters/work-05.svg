<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140c26"/>
      <stop offset="1" stop-color="#0a0616"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="98"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6035d4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ac95ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9f6b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="1050" fill="url(#bg)"/>
  <g>
    <circle cx="588" cy="315" r="420" fill="#6035d4" opacity="0.8" filter="url(#soft)"/>
    <circle cx="812" cy="252" r="308" fill="#ac95ff" opacity="0.6" filter="url(#soft)"/>
    <circle cx="784.0000000000001" cy="987" r="476.00000000000006" fill="#ff9f6b" opacity="0.55" filter="url(#soft)"/>
  </g>
  <rect width="1400" height="1050" fill="url(#grid)"/>
  <rect width="1400" height="1050" filter="url(#grain)" opacity="0.05"/>

  <!-- 装饰线 -->
  <rect x="112" y="546" width="1176" height="1.5" fill="url(#line)"/>
  <circle cx="112" cy="546.75" r="4" fill="#ac95ff"/>

  <!-- 文字 -->
  <text x="112" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="161" font-weight="700" fill="#ffffff" fill-opacity="0.9"
        letter-spacing="-8.4">05</text>

  <text x="112" y="651" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="45" font-weight="600" fill="#ffffff" fill-opacity="0.86">Prism Dataviz</text>

  <text x="112" y="714" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="400" fill="#ffffff" fill-opacity="0.42"
        letter-spacing="5.6000000000000005">DATA VIZ / WEB · 2024</text>

  <text x="1288" y="976.5" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="20" fill="#ffffff" fill-opacity="0.3"
        letter-spacing="7">COLORFUL'S SPACE</text>
</svg>