<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#DFDCCF">
  <link rel="icon" type="image/png" href="icon.png">
  <title>Nabi 物料登记</title>
  <script src="html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #DFDCCF;
      --bg-soft: #F1EEE9;
      --panel: #FAF7F1;
      --ink: #4A3F35;
      --muted: #8C7E6B;
      --line: #D8D2C2;
      --accent: #C9A87C;
      --accent-dark: #A6885E;
      --check: #7FA86B;
      --danger: #C76B6B;
      --radius: 18px;
      --shadow: 0 4px 20px rgba(74, 63, 53, 0.08);
      /* 顶部让位 = 状态栏安全区 + 容器导航栏(约 44px，这里留 48px)。
         安全区按官方规范用 var(--safe-area-inset-*, env(...)) 组合：
         PC 模拟器注入 --safe-area-inset-*，真机取 env() 真实值。
         若 banner 仍被挡，把 48px 调大（如 64px）；留白过多则调小。 */
      --top-gap: calc(var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) + 8px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    /* 内嵌演示时不显示系统滚动条，仍保留滚轮/触摸滚动能力 */
    html, body { scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar {
      width: 0 !important;
      height: 0 !important;
      display: none !important;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.5;
      font-size: 16px;
      padding-bottom: 110px;
      -webkit-text-size-adjust: 100%;
    }

    /* ===== Top header banner (The Playlist) ===== */
    .app-header {
      width: 100%;
      background: var(--bg);
      padding: var(--top-gap) 16px 16px;
      text-align: center;
    }
    .app-header .header-art {
      width: 100%;
      max-width: 720px;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .app-header .owner-id {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    /* ===== View router ===== */
    .view { display: none; }
    .view.active { display: block; }

    .container { max-width: 720px; margin: 0 auto; padding: 0 14px; }

    /* ===== Top nav row (left entry / right actions) ===== */
    .top-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0 6px;
    }
    .nav-btn {
      border: 1.5px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }
    .nav-btn:active { transform: scale(0.96); }
    .nav-btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .nav-spacer { flex: 1; }

    .register-panel {
      background: var(--bg-soft);
      min-height: calc(100vh - 60px);
      padding-bottom: 24px;
    }

    /* ===== Tabs ===== */
    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-soft);
      margin: 0 -14px;
      padding: 4px 14px 10px;
      box-shadow: 0 4px 14px rgba(74, 63, 53, 0.05);
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 0 8px;
      margin: 0 -4px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1.5px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: none;
    }
    .tab.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    /* ===== Stats (data summary — non-button style) ===== */
    .stats {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 0;
      margin: 10px 0 0;
      padding: 8px 4px 0;
      font-size: 12px;
      color: var(--muted);
    }
    .stat-item {
      flex: 1;
      text-align: center;
      padding: 0 4px;
      position: relative;
    }
    .stat-item + .stat-item::before {
      content: "";
      position: absolute;
      left: 0; top: 18%;
      height: 64%;
      width: 1px;
      background: var(--line);
    }
    .stat-item .num {
      display: block;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
    }
    .stat-item.warn .num { color: var(--danger); }
    .stat-item .label { font-size: 12px; }

    /* ===== Data table ===== */
    .data-list {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: var(--panel);
    }
    .data-head {
      display: grid;
      grid-template-columns: 40px 36px 1.4fr 1fr 36px 36px;
      align-items: center;
      gap: 4px;
      padding: 10px 8px;
      background: rgba(201, 168, 124, 0.18);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
    }
    .data-head span { text-align: center; }
    .data-head .dh-id, .data-head .dh-ex { text-align: left; padding-left: 4px; }

    .data-item {
      display: grid;
      grid-template-columns: 40px 36px 1.4fr 1fr 36px 36px;
      align-items: center;
      gap: 4px;
      padding: 10px 8px;
      background: transparent;
      border-bottom: 1px solid rgba(74, 63, 53, 0.08);
      transition: opacity .15s;
    }
    .data-item:last-child { border-bottom: none; }
    .data-item.received { opacity: 0.55; }
    .data-item.received .di-id,
    .data-item.received .di-ex { text-decoration: line-through; }

    .di-check {
      width: 22px; height: 22px;
      border: 2px solid var(--line);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #fff;
      margin: 0 auto;
      cursor: pointer;
      transition: all .15s;
    }
    .di-check.checked {
      background: var(--check);
      border-color: var(--check);
      color: #fff;
    }
    .di-check.checked::after {
      content: "✓";
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }
    .di-index {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    .di-id {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 2px 4px;
      border-radius: 4px;
      cursor: pointer;
    }
    .di-ex {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 2px 4px;
      border-radius: 4px;
      cursor: pointer;
    }
    .di-id:focus, .di-ex:focus {
      background: rgba(201, 168, 124, 0.18);
      outline: none;
    }
    .di-del {
      width: 28px; height: 28px;
      border: none;
      background: transparent;
      color: var(--danger);
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      margin: 0 auto;
      display: flex; align-items: center; justify-content: center;
    }
    .di-del:active { background: #fff0f0; }
    .di-move {
      width: 28px; height: 28px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      cursor: grab;
      border-radius: 8px;
      margin: 0 auto;
      display: flex; align-items: center; justify-content: center;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .di-move:active { background: rgba(74, 63, 53, 0.08); }
    /* 拖拽中的行：跟随手指、浮起 */
    .data-item.dragging {
      position: relative;
      z-index: 20;
      background: #fff;
      box-shadow: 0 10px 26px rgba(74, 63, 53, 0.2);
      border-radius: 10px;
      opacity: 0.95;
      transition: none;
    }
    /* 让位中的行：平滑过渡 */
    .data-item.shift { transition: transform .18s ease; }
    .btn:disabled { opacity: 0.4; pointer-events: none; }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      font-size: 14px;
      background: transparent;
      border: 1.5px dashed rgba(74, 63, 53, 0.28);
      border-radius: 16px;
    }
    /* 无记录时：卡片不铺底色、不画实线边框，背景与页面底色一致，只留虚线外框 */
    .data-list.is-empty {
      background: transparent;
      border-color: transparent;
    }

    /* ===== Search ===== */
    .search-box {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
    }
    .search-box input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      background: var(--bg-soft);
      color: var(--ink);
      font-size: 14px;
      outline: none;
    }
    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.6;
    }

    /* ===== FAB ===== */
    .fab {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(18px + env(safe-area-inset-bottom));
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(74, 63, 53, 0.3);
      z-index: 60;
      cursor: pointer;
    }
    .fab:active { transform: translateX(-50%) scale(0.96); }
    .fab.secondary { background: var(--accent); }

    /* ===== Bottom sheet ===== */
    .sheet-overlay {
      position: fixed; inset: 0;
      background: rgba(74, 63, 53, 0.45);
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease;
      z-index: 110;
    }
    .sheet-overlay.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--panel);
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.2);
      padding: 18px 18px calc(22px + env(safe-area-inset-bottom));
      z-index: 120;
      transform: translateY(100%);
      transition: transform .28s ease;
    }
    .sheet.show { transform: translateY(0); }
    /* 删除确认需盖过设置弹窗（modal z-index 200） */
    #deleteSheetOverlay { z-index: 210; }
    #deleteSheet { z-index: 220; }
    .sheet h3 { margin: 0 0 14px; font-size: 17px; }
    .sheet label { display: block; font-size: 13px; color: var(--muted); margin: 10px 4px 6px; }
    .sheet input {
      width: 100%;
      padding: 14px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      font-size: 16px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }
    .sheet input:focus { border-color: var(--accent); }
    .sheet .btn-row { display: flex; gap: 10px; margin-top: 14px; }
    .sheet .btn { flex: 1; padding: 14px; font-size: 15px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; }
    .sheet .btn-primary { background: var(--accent); color: #fff; }
    .sheet .btn-secondary { background: var(--bg); color: var(--ink); }
    .sheet .btn-danger { background: var(--danger); color: #fff; }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(74, 63, 53, 0.45);
      display: none;
      align-items: center; justify-content: center;
      z-index: 200;
      padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--panel);
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }
    .modal-header {
      padding: 16px 18px;
      border-bottom: 1.5px solid var(--line);
      font-weight: 700;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-body { padding: 16px 18px; overflow-y: auto; }
    .modal-footer { padding: 12px 18px 18px; display: flex; gap: 10px; justify-content: flex-end; }
    .close-x { background: none; border: none; font-size: 22px; color: var(--muted); cursor: pointer; }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 5px;
      box-shadow: var(--shadow);
      transition: transform .1s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--panel); color: var(--ink); border: 1.5px solid var(--line); }
    .btn-danger { background: #fff0f0; color: var(--danger); border: 1.5px solid #f0d0d0; }
    .btn-ink { background: var(--ink); color: #fff; }

    .tools-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .tools-grid .btn { flex-direction: column; padding: 14px 8px; font-size: 13px; gap: 6px; }
    .tools-grid .btn span { font-size: 22px; }

    textarea.import-area {
      width: 100%;
      min-height: 160px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      font-family: monospace;
      resize: vertical;
      background: #fff;
      color: var(--ink);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all .25s ease;
      z-index: 300;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== Notes view (互换物料 Tips) ===== */
    .notes-wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }
    .notes-h1 {
      text-align: center;
      font-size: 24px;
      letter-spacing: 2px;
      margin: 22px 0 14px;
      font-weight: 700;
    }
    .notes-h2 {
      font-size: 17px;
      font-weight: 700;
      margin: 22px 0 10px;
      letter-spacing: 1px;
    }
    .notes-materials {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }
    .notes-mat-card {
      background: var(--panel);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 8px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .notes-mat-card img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
      margin-bottom: 6px;
    }
    .notes-mat-card span { font-size: 13px; color: var(--muted); }

    .notes-divider { border: none; margin: 22px 0; }

    .notes-list { list-style: none; padding: 0; margin: 0; }
    .notes-list li {
      background: var(--panel);
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .notes-list .num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px;
      background: var(--ink);
      color: #fff;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-right: 8px;
      vertical-align: middle;
    }
    .notes-list .title { font-weight: 700; font-size: 16px; }
    .notes-list p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .notes-list .inline-img {
      width: 100%;
      max-width: 140px;
      border-radius: 12px;
      margin: 10px auto 4px;
      display: block;
    }
    .notes-list .caption {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: 4px 0 6px;
    }

    .notes-tips {
      background: rgba(201, 168, 124, 0.15);
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 14px;
      color: var(--muted);
      margin: 18px 0;
    }
    .notes-tips strong { color: var(--ink); }

    /* location horizontal layout (text left, image right) */
    .loc-row {
      display: flex;
      gap: 14px;
      background: var(--panel);
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      align-items: flex-start;
    }
    .loc-row .loc-text {
      flex: 1 1 0;
      min-width: 0;
    }
    .loc-row .loc-text .title { font-weight: 700; font-size: 16px; }
    .loc-row .loc-text .title .num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px;
      background: var(--ink);
      color: #fff;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-right: 8px;
      vertical-align: middle;
    }
    .loc-row .loc-text p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .loc-row .loc-img-wrap {
      flex: 0 0 110px;
      width: 110px;
      text-align: center;
    }
    .loc-row .loc-img {
      width: 100%;
      border-radius: 12px;
      display: block;
      margin-bottom: 6px;
    }
    .loc-row .loc-caption {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    /* ootd horizontal layout (text left, image right) */
    .ootd-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 14px;
      background: var(--panel);
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .ootd-row .ootd-img {
      width: 30%;
      max-width: 90px;
      flex: 0 0 30%;
      border-radius: 12px;
      display: block;
      object-fit: cover;
    }
    .ootd-row .ootd-text {
      flex: 1 1 0;
      min-width: 0;
      text-align: left;
      font-size: 14px;
      line-height: 1.7;
      color: var(--muted);
    }
    .ootd-row .ootd-text strong { color: var(--ink); font-size: 15px; }
    .notes-footer {
      background: var(--ink);
      color: #fff;
      text-align: center;
      padding: 14px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      margin-top: 10px;
    }

    [contenteditable="true"] {
      outline: none;
      border-radius: 6px;
      transition: background .2s;
    }
    [contenteditable="true"]:hover { background: rgba(201, 168, 124, 0.12); }
    [contenteditable="true"]:focus { background: rgba(201, 168, 124, 0.22); }

    /* ===== Export area (hidden, for image render) ===== */
    .hidden-export {
      position: fixed;
      top: 0;
      left: 0;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
      width: 520px;
      background: var(--bg);
    }

    @media (max-width: 420px) {
      .tab { padding: 8px 13px; font-size: 13px; }
      .nav-btn { padding: 7px 12px; font-size: 12px; }
      .notes-materials { gap: 8px; }
      .notes-mat-card { padding: 6px; }
      .notes-mat-card span { font-size: 12px; }
      .di-id { font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- ===== Registration View ===== -->
  <section class="view active" id="viewRegister">
    <div class="app-header">
      <img src="header.png" alt="The Playlist · Nana's Carnival" class="header-art">
    </div>

    <div class="register-panel">
      <div class="container">
        <div class="top-nav">
          <div class="nav-spacer"></div>
          <button class="nav-btn" data-act="openExportSheet">生成长图</button>
          <button class="nav-btn" data-act="openToolsMenu">工具箱</button>
        </div>

        <div class="sticky-top">
          <nav class="tabs" id="tabs"></nav>
          <div class="search-box" style="margin: 4px 0 4px;">
            <input type="text" id="searchInput" placeholder="搜索小红书ID…" data-input="renderRows">
          </div>
          <div class="stats" id="stats"></div>
        </div>

        <div class="data-list" id="rows"></div>
      </div>
    </div>

    <button class="fab" data-act="openAddSheet">+ 添加记录</button>
  </section>

  <!-- ===== Shared sheets / modals ===== -->
  <div class="sheet-overlay" id="sheetOverlay" data-act="closeAddSheet"></div>
  <div class="sheet" id="sheet">
    <h3 id="sheetTitle">添加记录</h3>
    <label>小红书ID</label>
    <input type="text" id="sheetId" placeholder="例如：三文鱼拌蟹籽" autocomplete="off">
    <label>互换物</label>
    <input type="text" id="sheetExchange" placeholder="例如：吧唧" autocomplete="off"
      data-enter="confirmAddSheet">
    <div class="btn-row">
      <button class="btn btn-secondary" data-act="closeAddSheet">取消</button>
      <button class="btn btn-primary" data-act="confirmAddSheet">确认添加</button>
    </div>
  </div>

  <div class="sheet-overlay" id="exportSheetOverlay" data-act="closeExportSheet"></div>
  <div class="sheet" id="exportSheet">
    <h3>生成长图</h3>
    <div class="btn-row" style="flex-direction:column; gap:10px;">
      <button class="btn btn-primary" data-act="closeExportSheet,captureCurrent">当前表格长图</button>
      <button class="btn btn-secondary" data-act="closeExportSheet,captureAll">全部表格长图</button>
    </div>
  </div>

  <div class="sheet-overlay" id="deleteSheetOverlay" data-act="closeDeleteSheet"></div>
  <div class="sheet" id="deleteSheet">
    <h3>确认删除</h3>
    <p id="deleteSheetText" style="margin:0 0 10px; color:var(--muted);">是否删除这条记录？</p>
    <div class="btn-row">
      <button class="btn btn-secondary" data-act="closeDeleteSheet">取消</button>
      <button class="btn btn-danger" id="deleteSheetConfirm">删除</button>
    </div>
  </div>

  <div class="modal-overlay" id="modal" data-act="closeModalOnBackdrop" data-evt="1">
    <div class="modal" data-stop="1">
      <div class="modal-header">
        <span id="modalTitle">操作</span>
        <button class="close-x" data-act="closeModal">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <div id="exportHidden" class="hidden-export"></div>
  <div class="toast" id="toast"></div>

  <script src="./app.js"></script>
</body>
</html>
